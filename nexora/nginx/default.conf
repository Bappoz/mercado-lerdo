log_format nexora_json escape=json
  '{"time":"$time_iso8601","method":"$request_method","uri":"$request_uri",'
  '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
  '"upstream":"$upstream_addr","upstream_time":"$upstream_response_time"}';

upstream nexora {
    server app:8080;
}

server {
    listen 8080;
    access_log /dev/stdout nexora_json;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://nexora;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }
}

# Status interno para o exporter de métricas (não é publicado para o host).
server {
    listen 8081;
    access_log off;
    location = /stub_status {
        stub_status;
    }
}
