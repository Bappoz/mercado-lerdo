# What Tabby recommends reading for C2 (ADR-0026): subjects worth understanding,
# never the diagnosis (that is the hint ladder's, and it costs salary). `why` is
# in her words; `minutes` is an estimate of the part she points at.

- id: conexoes
  title: Conexões do Postgres e o limite max_connections
  source: Documentação do PostgreSQL
  url: https://www.postgresql.org/docs/current/runtime-config-connection.html
  lang: en
  minutes: 10
  why: |
    Cada conexão custa um processo inteiro no servidor, e por isso o banco aceita um número fixo delas. Leia o que a documentação diz de `max_connections`.

- id: atividade
  title: "pg_stat_activity: o que cada conexão está fazendo"
  source: Documentação do PostgreSQL
  url: https://www.postgresql.org/docs/current/monitoring-stats.html#MONITORING-PG-STAT-ACTIVITY-VIEW
  lang: en
  minutes: 10
  why: |
    Uma linha por conexão aberta. Saber ler a coluna `state` (`active`, `idle`, `idle in transaction`) responde muita pergunta sobre o que o banco está esperando.

- id: pool
  title: O pool de conexões do Go
  source: Documentação do Go
  url: https://go.dev/doc/database/manage-connections
  lang: en
  minutes: 10
  why: |
    O app não abre uma conexão por pedido: ele guarda um pool e empresta. Veja o que `SetMaxOpenConns` limita e lembre que cada instância do app tem o seu.

- id: transacoes
  title: O que é uma transação
  source: Documentação do PostgreSQL
  url: https://www.postgresql.org/docs/current/tutorial-transactions.html
  lang: en
  minutes: 10
  why: |
    O que um `BEGIN … COMMIT` garante, e o que acontece com o que já foi feito quando a transação é desfeita no meio.

- id: transacoes-go
  title: Transações no Go
  source: Documentação do Go
  url: https://go.dev/doc/database/execute-transactions
  lang: en
  minutes: 10
  why: |
    Do começo ao fim, uma transação ocupa uma conexão do pool. Repare também em como o Go liga a transação ao `context` do pedido.

- id: contexto
  title: "Context: cancelamento e prazos"
  source: Blog do Go
  url: https://go.dev/blog/context
  lang: en
  minutes: 15
  why: |
    Quando um cliente desiste de esperar, o `context` do pedido é cancelado, e tudo o que depende dele para junto. Vale entender o que "tudo" inclui.
